# Baut die Desktop-App für Windows, macOS und Linux und stellt die
# Web-App (für Tablets) auf GitHub Pages bereit.
# Bei einem Tag wie "v1.0" werden die Programme als Release veröffentlicht.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Eingangskontrolle-Windows
          - os: macos-latest
            artifact: Eingangskontrolle-macOS
          - os: ubuntu-24.04
            artifact: Eingangskontrolle-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux-Abhängigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-webkit2-4.1 libgirepository-2.0-dev libcairo2-dev pkg-config
          pip install PyGObject
      - run: pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --distpath dist --workpath build desktop/eingangskontrolle.spec
      - name: Paketieren
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ../${{ matrix.artifact }}.zip Eingangskontrolle.exe
          elif [ "$RUNNER_OS" = "macOS" ]; then ditto -c -k --keepParent Eingangskontrolle.app ../${{ matrix.artifact }}.zip
          else tar czf ../${{ matrix.artifact }}.tar.gz Eingangskontrolle; fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.*

  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
